
# ==========================================
# Telegram Request & Response Logger
# Shadowrocket Configuration
# ==========================================

[General]
bypass-system = true
skip-proxy = localhost, *.local
ipv6 = true
prefer-ipv6 = false

# ==========================================
# SCRIPT
# ==========================================

[Script]

TelegramLogger-Request = type=http-request,pattern=^https?:\/\/(?!api\.telegram\.org\/),requires-body=true,max-size=262144,script-path=https://raw.githubusercontent.com/USERNAME/REPO/main/TelegramLogger.js,timeout=15,enable=true

TelegramLogger-Response = type=http-response,pattern=^https?:\/\/(?!api\.telegram\.org\/),requires-body=true,max-size=262144,script-path=https://raw.githubusercontent.com/USERNAME/REPO/main/TelegramLogger.js,timeout=15,enable=true

# ==========================================
# MITM
# ==========================================

[MITM]
enable = true
hostname = *
